services:
  db:
    image: postgres:16
    container_name: o2t4_db
    # Docker default /dev/shm is 64MB — VACUUM/parallel maintenance OOMs there
    shm_size: "256mb"
    env_file: # Файл с переменными окружения (Вместо environment)
      - .env
    ports:
      - 5433:5432
    volumes:
      - o2t4_postgresdata:/var/lib/postgresql/data
    networks:
      - o2t4_network
    restart: always

  app:
    image: appimg
    build:
      context: .
    container_name: ytr_app
    # volumes:
    #   - ./pages:/code/pages
    env_file:
      - .env-docker
    depends_on: # Запускаем только после запуска БД и Redis (depends on = зависит от)
      - db
    command: sh -c "mkdir -p /code/logs && uvicorn app.fast_api.main:app --port 5000 --host 0.0.0.0 --proxy-headers"
    ports:
      - 5001:5000
    networks:
      - o2t4_network
    restart: always

  # Cron / manual: docker compose --profile ingest run --rm ingest auto
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: ytr_ingest
    env_file:
      - .env-docker
    volumes:
      - ./logs:/code/logs
    depends_on:
      - db
    networks:
      - o2t4_network
    profiles:
      - ingest

volumes:
  o2t4_postgresdata:
    name: backend_o2t4_postgresdata
    external: true

networks:
  o2t4_network:
    driver: bridge
