# user  nginx;
# worker_processes  1;

# error_log  /var/log/nginx/error.log warn;
# pid        /var/run/nginx.pid;

# events { 
#     worker_connections  1024;
# }

server {
    server_name o2t4.ru www.o2t4.ru;

    location / {
        root /var/www/o2t4/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/o2t4.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/o2t4.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name ytr.o2t4.ru www.ytr.o2t4.ru;

    # Nuxt SSG in site/; generated logos/wordstat in media/ (not wiped by deploy)
    root /srv/projects/ytratings/site/;
    index index.html;
    error_page 404 /404.html;

    location /channel_logo/ {
        alias /srv/projects/ytratings/media/channel_logo/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /wordstat_img/ {
        alias /srv/projects/ytratings/media/wordstat_img/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ytr.o2t4.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ytr.o2t4.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}



server {
    if ($host = www.o2t4.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = o2t4.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.ytr.o2t4.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ytr.o2t4.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name o2t4.ru www.o2t4.ru ytr.o2t4.ru www.ytr.o2t4.ru;
    return 404; # managed by Certbot
}
