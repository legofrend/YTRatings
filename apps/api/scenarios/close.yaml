# Month-close pipeline. Loaded by `python -m app.main auto` (priority over harvest).
# State (step done/pending) lives in PG table pipeline_run — not in this file.
#
# when: only days 1..day_of_month_lte (Europe/Moscow). After that auto skips close
# even if pipeline_run has pending holes — finish those via manual CLI / auto --force.
# period: previous_month → on Oct 1 close September.
#
# Priority: finish category 1 end-to-end before other cats burn quota.
# Channel-stat is cheap → all cats first. Final channel-report once at the end.
# `videos` already chains detail + shorts-sync + apply-is-short.

id: close

when:
  timezone: Europe/Moscow
  day_of_month_lte: 5

period: previous_month

steps:
  # --- cheap: channel totals for every active channel missing this period ---
  - id: channel_stat
    cmd: channel-stat

  # --- category 1 first (any priority) ---
  - id: videos_cat1
    cmd: videos
    cats: [1]
    priority_lte: null

  - id: video_stat_cat1
    cmd: video-stat
    cats: [1]

  # --- other categories ---
  # existing videos without this period's row (before spending quota on fetch)
  - id: video_stat_rest_existing
    cmd: video-stat
    cats_exclude: [1]

  - id: videos_rest
    cmd: videos
    cats_exclude: [1]
    priority_lte: null

  - id: video_stat_rest_new
    cmd: video-stat
    cats_exclude: [1]

  # --- denorm + ranks for the whole period ---
  - id: report_final
    cmd: channel-report
